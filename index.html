<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Management System</title>
    
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'brand-blue': {
              '50': '#eff6ff',
              '100': '#dbeafe',
              '200': '#bfdbfe',
              '300': '#93c5fd',
              '400': '#60a5fa',
              '500': '#3b82f6',
              '600': '#2563eb',
              '700': '#1d4ed8',
              '800': '#1e40af',
              '900': '#1e3a8a',
              '950': '#172554',
            },
          }
        }
      }
    }
  </script>
    <style type="text/css">
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Accessibility enhancement: Show a clear focus ring only for keyboard users */
      :focus-visible {
        outline: 3px solid #60a5fa; /* brand-blue-400 */
        outline-offset: 2px;
        border-radius: 4px;
      }
      @media print {
        .print-hide {
          display: none !important;
        }
        body {
          background-color: white !important;
        }
        * {
          color: black !important;
          background-color: transparent !important;
          box-shadow: none !important;
          text-shadow: none !important;
        }
        main {
          padding: 0 !important;
        }
      }
    </style>
